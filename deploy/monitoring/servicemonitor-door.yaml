apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: door
  namespace: inference
  labels:
    app.kubernetes.io/part-of: inference
spec:
  selector:
    matchLabels:
      app: door
  namespaceSelector:
    matchNames:
      - inference
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
