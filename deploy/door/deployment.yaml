apiVersion: apps/v1
kind: Deployment
metadata:
  name: door
  namespace: inference
  labels:
    app: door
    app.kubernetes.io/part-of: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: door
  template:
    metadata:
      labels:
        app: door
        app.kubernetes.io/part-of: inference
    spec:
      containers:
        - name: door
          image: inference-door:local
          imagePullPolicy: IfNotPresent
          command: ["python3", "run_door.py"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: HOLD_BUDGET_SECONDS
              value: "900"
            - name: ENGINE_URL
              value: "http://vllm.inference.svc:8000"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
