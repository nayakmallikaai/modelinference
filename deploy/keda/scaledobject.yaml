apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm
  namespace: inference
  labels:
    app.kubernetes.io/part-of: inference
spec:
  scaleTargetRef:
    name: vllm
  minReplicaCount: 0
  maxReplicaCount: 2
  cooldownPeriod: 600
  pollingInterval: 10
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        threshold: "1"
        query: |
          sum(door_requests_waiting or vector(0))
          + sum(door_requests_in_flight or vector(0))
          + sum(vllm:num_requests_waiting or vector(0))
          + sum(vllm:num_requests_running or vector(0))
