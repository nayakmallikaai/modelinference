apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-spot
  labels:
    app.kubernetes.io/part-of: inference
spec:
  weight: 50
  limits:
    cpu: "8"
    nvidia.com/gpu: "2"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
  template:
    metadata:
      labels:
        inference.ai/gpu: "true"
    spec:
      expireAfter: 24h
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["g6.xlarge", "g5.xlarge"]
